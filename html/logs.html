<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="文件下载">文件下载</title>
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/logs.css">
<script src="/js/theme.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/auth.js"></script>
</head><body>
<div class="top-bar">
  <div class="tb-left">
    <h1>📁 <span data-i18n="文件下载">文件下载</span></h1>
  </div>
  <div class="tb-right">
    <a href="/" class="btn btn-back">📊 <span data-i18n="主界面">主界面</span></a>
    <a href="/config" class="btn btn-back"> <span data-i18n="配置">配置</span></a>
    <button id="langBtn" class="theme-btn" onclick="toggleLang()" data-i18n-title="切换语言">English</button>
    <button id="themeBtn" class="theme-btn" onclick="toggleTheme()" data-i18n-title="切换主题">🌙</button>
  </div>
</div>
<div id="toast" class="toast"></div>
<main class="file-manager">
  <section class="file-section" aria-labelledby="logs_title">
    <div class="file-section-header">
      <h2 id="logs_title">📋 <span data-i18n="日志">日志</span></h2>
      <div class="file-actions">
        <a href="/logs/pack" class="btn btn-pack" id="pack_btn">📦 <span data-i18n="打包下载">打包下载</span></a>
        <button class="btn btn-pack btn-clear" id="clear_btn">🗑 <span data-i18n="清空日志">清空日志</span></button>
      </div>
    </div>
    <div class="tbl-wrap">
  <table id="tbl_logs">
    <thead><tr><th data-i18n="日期">日期</th><th data-i18n="文件名">文件名</th><th data-i18n="大小">大小</th><th data-i18n="修改时间">修改时间</th><th data-i18n="操作">操作</th></tr></thead>
    <tbody id="rows_logs"></tbody>
  </table>
    </div>
  </section>
  <section class="file-section" aria-labelledby="rec_title">
    <div class="file-section-header">
      <h2 id="rec_title">🎬 <span data-i18n="录像">录像</span></h2>
      <div class="file-actions">
        <button class="btn btn-pack" id="split_rec_btn" disabled data-i18n="截断并续录" data-i18n-title="保存当前录像文件并继续录制到新文件">截断并续录</button>
        <a href="/api/rec/pack" class="btn btn-pack" id="pack_rec_btn">📦 <span data-i18n="打包下载">打包下载</span></a>
        <button class="btn btn-pack btn-clear" id="clear_rec_btn">🗑 <span data-i18n="清空录像">清空录像</span></button>
      </div>
    </div>
    <div class="tbl-wrap">
  <table id="tbl_rec">
    <thead><tr><th data-i18n="日期">日期</th><th data-i18n="文件名">文件名</th><th data-i18n="大小">大小</th><th data-i18n="修改时间">修改时间</th><th data-i18n="操作">操作</th></tr></thead>
    <tbody id="rows_rec"></tbody>
  </table>
    </div>
  </section>
  <section class="file-section" id="detections_panel" aria-labelledby="detections_title">
    <div class="file-section-header">
      <h2 id="detections_title">📄 <span data-i18n="识别结果">识别结果</span></h2>
      <div class="file-actions">
        <a href="/api/detections/reports/pack" class="btn btn-pack" id="pack_detections_btn">📦 <span data-i18n="打包下载">打包下载</span></a>
        <button class="btn btn-pack btn-clear" id="clear_detections_btn">🗑 <span data-i18n="清空识别结果">清空识别结果</span></button>
      </div>
    </div>
    <div class="tbl-wrap">
    <table><thead><tr><th data-i18n="日期">日期</th><th data-i18n="文件名">文件名</th><th data-i18n="大小">大小</th><th data-i18n="操作">操作</th></tr></thead><tbody id="rows_detection_reports"></tbody></table>
    </div>
  </section>
</main>
<script src="/js/logs.js"></script>
<script src="/js/detections.js"></script>
</body></html>
