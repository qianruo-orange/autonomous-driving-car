    <a href="/config" class="btn btn-back"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17.5 7H20M4 17h2.5M11 17h9"/><circle cx="15" cy="7" r="2.3"/><circle cx="6.5" cy="17" r="2.3"/></svg><span data-i18n="系统配置">系统配置</span></a>
    <button id="langBtn" class="theme-btn" onclick="toggleLang()" data-i18n-title="切换语言">English</button>
    <button id="themeBtn" class="theme-btn" onclick="toggleTheme()" data-i18n-title="切换主题"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 14.6A8.6 8.6 0 1 1 9.4 3.8a7 7 0 0 0 10.8 10.8z"/></svg></button>

</div>
<div id="toast" class="toast"></div>
<main class="file-manager">
  <section class="file-section" aria-labelledby="logs_title">
    <div class="file-section-header">
      <h2 id="logs_title"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4.5" width="16" height="15" rx="2"/><path d="M8.5 9.5h7M8.5 13h7M8.5 16.5h4"/></svg> <span data-i18n="日志">日志</span></h2>
      <div class="file-actions">
        <a href="/logs/pack" class="btn btn-pack" id="pack_btn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="4.6" rx="1.5"/><path d="M5 8.6V19a1.6 1.6 0 0 0 1.6 1.6h10.8A1.6 1.6 0 0 0 19 19V8.6"/><path d="M10 12.4h4"/></svg> <span data-i18n="打包下载">打包下载</span></a>
        <button class="btn btn-pack btn-clear" id="clear_btn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9.2 7V5.6A1.6 1.6 0 0 1 10.8 4h2.4a1.6 1.6 0 0 1 1.6 1.6V7"/><path d="M6.6 7l.7 12.1a1.6 1.6 0 0 0 1.6 1.5h6.2a1.6 1.6 0 0 0 1.6-1.5L17.4 7"/></svg> <span data-i18n="清空日志">清空日志</span></button>
      </div>
    </div>
    <div class="tbl-wrap">
  <table id="tbl_logs">
    <colgroup><col class="file-col-date"><col class="file-col-name"><col class="file-col-size"><col class="file-col-mtime"><col class="file-col-actions"></colgroup>
    <thead><tr><th data-i18n="日期">日期</th><th data-i18n="文件名">文件名</th><th data-i18n="大小">大小</th><th data-i18n="修改时间">修改时间</th><th data-i18n="操作">操作</th></tr></thead>
    <tbody id="rows_logs"></tbody>
  </table>
    </div>
  </section>
  <section class="file-section" aria-labelledby="rec_title">
    <div class="file-section-header">
      <h2 id="rec_title"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2"/><path d="M10 9.5l5 2.5-5 2.5z"/></svg> <span data-i18n="录像">录像</span></h2>
      <div class="file-actions">
        <a href="/api/rec/pack" class="btn btn-pack" id="pack_rec_btn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="4.6" rx="1.5"/><path d="M5 8.6V19a1.6 1.6 0 0 0 1.6 1.6h10.8A1.6 1.6 0 0 0 19 19V8.6"/><path d="M10 12.4h4"/></svg> <span data-i18n="打包下载">打包下载</span></a>
        <button class="btn btn-pack btn-clear" id="clear_rec_btn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9.2 7V5.6A1.6 1.6 0 0 1 10.8 4h2.4a1.6 1.6 0 0 1 1.6 1.6V7"/><path d="M6.6 7l.7 12.1a1.6 1.6 0 0 0 1.6 1.5h6.2a1.6 1.6 0 0 0 1.6-1.5L17.4 7"/></svg> <span data-i18n="清空录像">清空录像</span></button>
      </div>
    </div>
    <div class="tbl-wrap">
  <table id="tbl_rec">
    <colgroup><col class="file-col-date"><col class="file-col-name"><col class="file-col-size"><col class="file-col-mtime"><col class="file-col-actions"></colgroup>
    <thead><tr><th data-i18n="日期">日期</th><th data-i18n="文件名">文件名</th><th data-i18n="大小">大小</th><th data-i18n="修改时间">修改时间</th><th data-i18n="操作">操作</th></tr></thead>
    <tbody id="rows_rec"></tbody>
  </table>
    </div>
  </section>
  <section class="file-section" id="detections_panel" aria-labelledby="detections_title">
    <div class="file-section-header">
      <h2 id="detections_title"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h7.5L19 9v11.5H6z"/><path d="M13.5 3.5V9H19"/></svg> <span data-i18n="结果">结果</span></h2>
      <div class="file-actions">
        <a href="/api/detections/reports/pack" class="btn btn-pack" id="pack_detections_btn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="4.6" rx="1.5"/><path d="M5 8.6V19a1.6 1.6 0 0 0 1.6 1.6h10.8A1.6 1.6 0 0 0 19 19V8.6"/><path d="M10 12.4h4"/></svg> <span data-i18n="打包下载">打包下载</span></a>
        <button class="btn btn-pack btn-clear" id="clear_detections_btn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9.2 7V5.6A1.6 1.6 0 0 1 10.8 4h2.4a1.6 1.6 0 0 1 1.6 1.6V7"/><path d="M6.6 7l.7 12.1a1.6 1.6 0 0 0 1.6 1.5h6.2a1.6 1.6 0 0 0 1.6-1.5L17.4 7"/></svg> <span data-i18n="清空结果">清空结果</span></button>
      </div>
    </div>
    <div class="tbl-wrap">
    <table><colgroup><col class="file-col-date"><col class="file-col-name"><col class="file-col-size"><col class="file-col-mtime"><col class="file-col-actions"></colgroup><thead><tr><th data-i18n="日期">日期</th><th data-i18n="文件名">文件名</th><th data-i18n="大小">大小</th><th data-i18n="修改时间">修改时间</th><th data-i18n="操作">操作</th></tr></thead><tbody id="rows_detection_reports"></tbody></table>
    </div>
  </section>

  <section class="file-section" id="codex_panel" aria-labelledby="codex_title">
    <div class="file-section-header">
      <h2 id="codex_title"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 6.5A2.5 2.5 0 0 1 7 4h10a2.5 2.5 0 0 1 2.5 2.5v7A2.5 2.5 0 0 1 17 16H9l-4.5 3.5z"/></svg> <span data-i18n="Codex">Codex</span></h2>
      <div class="file-actions">
        <a href="/api/codex/export" class="btn btn-pack" id="pack_codex_btn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="4.6" rx="1.5"/><path d="M5 8.6V19a1.6 1.6 0 0 0 1.6 1.6h10.8A1.6 1.6 0 0 0 19 19V8.6"/><path d="M10 12.4h4"/></svg> <span data-i18n="打包下载">打包下载</span></a>
        <button class="btn btn-pack btn-clear" id="clear_codex_btn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9.2 7V5.6A1.6 1.6 0 0 1 10.8 4h2.4a1.6 1.6 0 0 1 1.6 1.6V7"/><path d="M6.6 7l.7 12.1a1.6 1.6 0 0 0 1.6 1.5h6.2a1.6 1.6 0 0 0 1.6-1.5L17.4 7"/></svg> <span data-i18n="清空记录">清空记录</span></button>
      </div>
    </div>
    <div class="tbl-wrap">
      <table><colgroup><col class="file-col-date"><col class="file-col-name"><col class="file-col-size"><col class="file-col-mtime"><col class="file-col-actions"></colgroup>
      <thead><tr><th data-i18n="日期">日期</th><th data-i18n="文件名">文件名</th><th data-i18n="大小">大小</th><th data-i18n="修改时间">修改时间</th><th data-i18n="操作">操作</th></tr></thead>
      <tbody id="rows_codex"></tbody></table>
    </div>
  </section>
</main>
<div id="file_preview_overlay" class="file-preview-overlay" hidden>
  <section class="file-preview-dialog" role="dialog" aria-modal="true" aria-labelledby="file_preview_title">
    <div class="file-preview-header">
      <h2 id="file_preview_title" data-i18n="文件预览">文件预览</h2>
      <button type="button" class="btn btn-back" id="file_preview_close" data-i18n="关闭">关闭</button>
    </div>
    <p id="file_preview_name" class="file-preview-name"></p>
    <p id="file_preview_status" class="file-preview-status" role="status"></p>
    <pre id="file_preview_text" hidden></pre>
    <video id="file_preview_video" controls playsinline preload="metadata" hidden></video>
  </section>
</div>

<script src="/js/logs.js?v=2026110702"></script>
