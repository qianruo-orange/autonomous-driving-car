<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="日志与录像">日志与录像</title>
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/logs.css">
<script src="/js/theme.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/auth.js"></script>
</head><body>
<div class="top-bar">
  <div class="tb-left">
    <h1>📁 <span data-i18n="文件下载">文件下载</span></h1>
    <div class="tab-bar">
      <button class="tab-btn tab-on" data-tab="logs" onclick="switchTab('logs')">📋 <span data-i18n="日志">日志</span></button>
      <button class="tab-btn" data-tab="rec" onclick="switchTab('rec')">🎬 <span data-i18n="录像">录像</span></button>
      <button class="tab-btn" data-tab="detections" onclick="switchTab('detections')">📷 <span data-i18n="识别结果">识别结果</span></button>
    </div>
    <a href="/logs/pack" class="btn btn-pack" id="pack_btn">📦 <span data-i18n="打包下载">打包下载</span></a>
    <a href="/api/rec/pack" class="btn btn-pack" id="pack_rec_btn" style="display:none">📦 <span data-i18n="打包下载">打包下载</span></a>
    <button class="btn btn-pack" id="split_rec_btn" style="display:none" disabled data-i18n="截断并续录" data-i18n-title="保存当前录像文件并继续录制到新文件">截断并续录</button>
    <button class="btn btn-pack btn-clear" id="clear_btn">🗑 <span data-i18n="清空日志">清空日志</span></button>
    <button class="btn btn-pack btn-clear" id="clear_rec_btn" style="display:none">🗑 <span data-i18n="清空录像">清空录像</span></button>
  </div>
  <div class="tb-right">
    <a href="/" class="btn btn-back">📊 <span data-i18n="仪表盘">仪表盘</span></a>
    <a href="/dbc" class="btn btn-back"> <span data-i18n="DBC解析">DBC解析</span></a>
    <a href="/config" class="btn btn-back"> <span data-i18n="配置">配置</span></a>
    <button id="langBtn" class="theme-btn" onclick="toggleLang()" data-i18n-title="切换语言">EN</button>
    <button id="themeBtn" class="theme-btn" onclick="toggleTheme()" data-i18n-title="切换主题">🌙</button>
  </div>
</div>
<div id="toast" class="toast"></div>
<div class="tbl-wrap">
  <table id="tbl_logs">
    <thead><tr><th data-i18n="日期">日期</th><th data-i18n="文件名">文件名</th><th data-i18n="大小">大小</th><th data-i18n="修改时间">修改时间</th><th data-i18n="操作">操作</th></tr></thead>
    <tbody id="rows_logs"></tbody>
  </table>
  <table id="tbl_rec" style="display:none">
    <thead><tr><th data-i18n="日期">日期</th><th data-i18n="文件名">文件名</th><th data-i18n="大小">大小</th><th data-i18n="修改时间">修改时间</th><th data-i18n="操作">操作</th></tr></thead>
    <tbody id="rows_rec"></tbody>
  </table>
  <section id="detections_panel" style="display:none">
    <button type="button" class="btn btn-pack" id="refresh_detections" data-i18n="查询">查询</button>
    <h3 data-i18n="每日检测汇总">每日检测汇总</h3>
    <table><thead><tr><th data-i18n="日期">日期</th><th data-i18n="文件名">文件名</th><th data-i18n="大小">大小</th><th data-i18n="下载">下载</th></tr></thead><tbody id="rows_detection_reports"></tbody></table>
  </section>
</div>
<script src="/js/logs.js"></script>
<script src="/js/detections.js"></script>
</body></html>
