<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="系统配置">系统配置</title>
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/config.css">
<link rel="stylesheet" href="/css/camera.css">
<script src="/js/theme.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/auth.js"></script>
</head><body>
<div class="top-bar">
  <div class="tb-left">
    <h1>⚙ <span data-i18n="系统配置">系统配置</span></h1>
    <button type="button" class="btn btn-back" onclick="exportCfg()"> <span data-i18n="导出配置">导出配置</span></button>
    <span class="card-status" id="status_export"></span>
    <button type="button" class="btn btn-back" onclick="loadCfg()">🔄 <span data-i18n="查询">查询</span></button>
    <button type="button" id="can_feature_toggle" class="btn btn-back" onclick="toggleCanFeature()" aria-controls="card_can" aria-pressed="false" disabled><span data-i18n="启用 CAN">启用 CAN</span></button>
    <span class="card-status" id="status_can_feature" role="status" aria-live="polite"></span>
  </div>
  <div class="tb-right">
    <a href="/" class="btn btn-back"> <span data-i18n="主界面">主界面</span></a>
    <a href="/logs" class="btn btn-back">📁 <span data-i18n="行驶日志">行驶日志</span></a>
    <button id="langBtn" class="theme-btn" onclick="toggleLang()" data-i18n-title="切换语言">English</button>
    <button id="themeBtn" class="theme-btn" onclick="toggleTheme()" data-i18n-title="切换主题">🌙</button>
  </div>
</div>

<div id="f">
<div class="can-grid can-disabled">
  <form class="card" id="camera_form">
    <h3><span data-i18n="视频采集">视频采集</span><span id="camera_status" class="card-status" role="status" aria-live="polite"></span><button class="btn btn-save" type="submit" id="camera_save" style="margin-left:auto;padding:4px 14px" data-i18n="保存">保存</button></h3>
    <div class="camera-fields">
      <div class="row"><label for="camera_device" data-i18n="相机设备">相机设备</label><select id="camera_device"></select></div>
      <div class="row"><label for="camera_mode" data-i18n="分辨率与帧率">分辨率与帧率</label><select id="camera_mode"></select></div>
      <div class="row"><label for="camera_codec" data-i18n="视频编码">视频编码</label><select id="camera_codec"><option value="software" data-i18n="软件编码">软件编码</option><option value="hardware" data-i18n="硬件编码">硬件编码</option></select></div>
      <div class="row"><label for="camera_decoder" data-i18n="视频解码">视频解码</label><select id="camera_decoder"><option value="software" data-i18n="软件解码">软件解码</option><option value="hardware" disabled data-i18n="硬件解码（不可用）">硬件解码（不可用）</option></select></div>
    </div>
  </form>
<div class="card" id="card_yolo"><h3><span data-i18n="YOLO 检测">YOLO 检测</span><span class="card-status" id="status_yolo"></span><button type="button" class="btn btn-save" style="margin-left:auto;padding:4px 14px" onclick="saveYolo()">💾 <span data-i18n="保存">保存</span></button></h3>
<div class="yolo-split">
<div class="yolo-col">
<div class="grp-t" data-i18n="推理参数">推理参数</div>
<div class="cfg-grid yolo-basic">
<div class="row"><label data-i18n="置信度">置信度</label><input id="yolo_cf" type="number" min="1" max="100" step="1"><span class="unit">%</span></div>
<div class="row"><label>NMS IoU</label><input id="yolo_nm" type="number" min="1" max="100" step="1"><span class="unit">%</span></div>
</div>
</div>
<div class="yolo-col">
<div class="grp-t" data-i18n="模型文件">模型文件</div>
<div class="cfg-grid yolo-upload">
<div class="row"><label data-i18n="上传模型">上传模型</label><input type="file" id="yolo_model_f" accept=".rknn" hidden><button type="button" class="add-btn" data-file-picker="yolo_model_f" data-i18n="选择文件">选择文件</button><span class="unit" data-file-name="yolo_model_f" data-i18n="未选择文件" style="flex:1;overflow-wrap:anywhere">未选择文件</span><button type="button" class="add-btn" onclick="uploadYolo('model')" data-i18n="上传">上传</button></div>
<div class="row"><label data-i18n="上传标签">上传标签</label><input type="file" id="yolo_names_f" accept=".names,.txt" hidden><button type="button" class="add-btn" data-file-picker="yolo_names_f" data-i18n="选择文件">选择文件</button><span class="unit" data-file-name="yolo_names_f" data-i18n="未选择文件" style="flex:1;overflow-wrap:anywhere">未选择文件</span><button type="button" class="add-btn" onclick="uploadYolo('names')" data-i18n="上传">上传</button></div>
</div>
</div>
</div>
</div>

<div class="card" id="card_can" hidden><h3><select id="canSel" onchange="onCanSel()"></select> <span id="st"></span> <label class="toggle"><input type="checkbox" id="tg" onchange="toggleCan(this.checked)"><span class="slider"></span></label><span class="card-status" id="status_can"></span><a href="/dbc" class="btn btn-back can-dbc-link"><span data-i18n="DBC解析">DBC解析</span></a><button type="button" class="btn btn-save" style="margin-left:0;padding:4px 14px" onclick="saveCan()">💾 <span data-i18n="保存">保存</span></button></h3>
<div id="cfg">
<div class="cfg-grid can-basic">
<div class="row"><label data-i18n="波特率">波特率</label><input name="br" id="br" type="number"><span class="unit">bps</span></div>
<div class="row"><label data-i18n="DBC 文件">DBC 文件</label><input type="file" id="dbc" accept=".dbc" hidden><button type="button" class="add-btn" data-file-picker="dbc" data-i18n="选择文件">选择文件</button><span class="unit" data-file-name="dbc" data-i18n="未选择文件" style="flex:1;overflow-wrap:anywhere">未选择文件</span><button type="button" class="add-btn" onclick="uploadDbc()" data-i18n="上传">上传</button></div>
<div class="row"><label>CAN FD</label><select name="fd" id="fd" onchange="chkFd()"><option value="on">on</option><option value="off">off</option></select></div>
<div class="row" id="dbr"><label data-i18n="FD波特率">FD波特率</label><input name="db" id="db" type="number"><span class="unit">bps</span></div>
</div>
<div class="filters">
<h4><span data-i18n="CAN-ID 过滤器">CAN-ID 过滤器</span><button type="button" class="add-btn" onclick="addFilter()" data-i18n="+ 添加">+ 添加</button></h4>
<div id="fil"></div>
</div>
</div><div class="hint" id="hint" data-i18n="接口已关闭，开启后可配置">接口已关闭，开启后可配置</div></div>

<div class="card" id="card_net"><h3><span data-i18n="网络设置">网络设置</span><span class="card-status" id="status_net"></span><button type="button" class="btn btn-save" style="margin-left:auto;padding:4px 14px" id="network_save" disabled onclick="saveNet()">💾 <span data-i18n="保存">保存</span></button></h3>
<div class="cfg-grid net2">
<div class="row"><label data-i18n="Web网卡">Web网卡</label><select name="bind" id="bind"><option value="" data-i18n="选择网卡">选择网卡</option></select></div>
<div class="row"><label data-i18n="IP 模式">IP 模式</label><select id="ip_mode" onchange="chkIpMode()"><option value="" data-i18n="关闭（不管理）">关闭（不管理）</option><option value="static" data-i18n="静态">静态</option><option value="dhcp">DHCP</option></select></div>
<div class="row" id="ip_a_row"><label data-i18n="IP 地址">IP 地址</label><input id="ip_a" type="text" placeholder="192.168.1.100"></div>
<div class="row" id="ip_m_row"><label data-i18n="子网掩码">子网掩码</label><input id="ip_m" type="text" placeholder="255.255.255.0"></div>
<div class="row" id="ip_g_row"><label data-i18n="网关">网关</label><input id="ip_g" type="text" placeholder="192.168.1.1"></div>
</div>
</div>

<div class="card" id="card_cpufreq"><h3><span data-i18n="CPU 频率">CPU 频率</span><span class="card-status" id="status_cpufreq"></span><button type="button" class="btn btn-save" style="margin-left:auto;padding:4px 14px" onclick="saveCpuFreq()">💾 <span data-i18n="保存">保存</span></button></h3>
<div class="cfg-grid vid2">
<div class="row"><label data-i18n="CPU 策略组">CPU 策略组</label><select id="cf_policy"></select></div>
<div class="row"><label data-i18n="调度策略">调度策略</label><select id="cf_gov"></select></div>
<div class="row"><label data-i18n="最低频率">最低频率</label><select id="cf_min"></select></div>
<div class="row"><label data-i18n="最高频率">最高频率</label><select id="cf_max"></select></div>
</div>
<div class="ip-cur" id="cf_cur" data-i18n="当前未读取">当前未读取</div>
</div>

<div class="card" id="card_nettest"><h3><span data-i18n="网络测试">网络测试</span><span class="card-status" id="status_nettest"></span><span class="nt-result" id="nt_ping_result"></span><span class="nt-result" id="nt_speed_result"></span><span class="nt-result" id="nt_reach_result"></span></h3>
<div class="nt-section">
<div class="nt-row">
<label data-i18n="Ping 测试">Ping 测试</label>
<div class="nt-input-group">
<input type="text" id="nt_ping_target" data-i18n-ph="IP / 域名" placeholder="IP / 域名" value="192.168.1.1">
</div>
<button type="button" class="btn btn-back nt-go" onclick="runNetTest('ping')" data-i18n="测试">测试</button>
</div>
<div class="nt-row">
<label data-i18n="网速测试">网速测试</label>
<div class="nt-input-group">
<select id="nt_speed_target">
<option value="https://speed.cloudflare.com/__down?bytes=5000000" data-i18n="Cloudflare CDN">Cloudflare CDN</option>
<option value="https://proof.ovh.net/files/1Mb.dat" data-i18n="OVH (欧洲)">OVH (欧洲)</option>
<option value="custom" data-i18n="自定义地址">自定义地址</option>
</select>
<input type="text" id="nt_speed_custom" placeholder="https://..." style="display:none">
</div>
<button type="button" class="btn btn-back nt-go" onclick="runNetTest('speed')" data-i18n="测速">测速</button>
</div>
<div class="nt-row">
<label data-i18n="网站可达性">网站可达性</label>
<div class="nt-input-group">
<input type="text" id="nt_reach_target" placeholder="https://example.com">
</div>
<button type="button" class="btn btn-back nt-go" onclick="runNetTest('reach')" data-i18n="检测">检测</button>
</div>
</div>
</div>

</div>
<div id="msg"></div>
</div>

<script src="/js/config.js"></script>
<script src="/js/camera.js"></script>
<script src="/js/car_sport_ctrl.js"></script>
<script src="/js/vofa.js"></script>
</body></html>
