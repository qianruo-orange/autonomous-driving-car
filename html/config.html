</head><body>
<div class="top-bar">
  <div class="tb-left">
    <h1><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17.5 7H20M4 17h2.5M11 17h9"/><circle cx="15" cy="7" r="2.3"/><circle cx="6.5" cy="17" r="2.3"/></svg> <span data-i18n="系统配置">系统配置</span></h1>
    <div class="tb-ops">
      <button type="button" class="btn btn-back" onclick="exportCfg()"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5V4"/><path d="M8.2 7.8L12 4l3.8 3.8"/><path d="M5 19.5h14"/></svg><span data-i18n="导出配置">导出配置</span></button>
    <span class="card-status" id="status_export"></span>
    <button type="button" class="btn btn-back" onclick="loadCfg()"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-.8 4.6"/><path d="M20 5.5v5.5h-5.5"/></svg> <span data-i18n="查询">查询</span></button>
    <button type="button" id="can_feature_toggle" class="btn btn-back" onclick="toggleCanFeature()" aria-controls="card_can" aria-pressed="false" disabled><span data-i18n="启用 CAN">启用 CAN</span></button>
    <span class="card-status" id="status_can_feature" role="status" aria-live="polite"></span>
    </div>
  </div>
  <div class="tb-right">
    <a href="/" class="btn btn-back"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/></svg><span data-i18n="主界面">主界面</span></a>
    <a href="/status" class="btn btn-back"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h3.5l2.5-7 4 14 2.5-7H21"/></svg> <span data-i18n="系统状态">系统状态</span></a>
    <a href="/logs" class="btn btn-back"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.4A1.9 1.9 0 0 1 4.9 5.5h3.8l2 2.6h8.4a1.9 1.9 0 0 1 1.9 1.9v6.6a1.9 1.9 0 0 1-1.9 1.9H4.9A1.9 1.9 0 0 1 3 16.6z"/></svg> <span data-i18n="文件下载">文件下载</span></a>
    <button id="langBtn" class="theme-btn" onclick="toggleLang()" data-i18n-title="切换语言">English</button>
    <button id="themeBtn" class="theme-btn" onclick="toggleTheme()" data-i18n-title="切换主题"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 14.6A8.6 8.6 0 1 1 9.4 3.8a7 7 0 0 0 10.8 10.8z"/></svg></button>
    <button id="paletteBtn" class="theme-btn" onclick="cyclePalette()" data-i18n-title="切换配色"></button>
  </div>
</div>

<div id="f">
<div class="bottom-grid">
<div class="card" id="card_yolo"><h3><span data-i18n="YOLO 检测">YOLO 检测</span><span class="card-status" id="status_yolo"></span><button type="button" class="btn btn-save card-save" onclick="saveYolo()"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v9.5"/><path d="M8.2 10.2L12 14l3.8-3.8"/><path d="M5 19h14"/></svg> <span data-i18n="保存">保存</span></button></h3>
<div class="yolo-split">
<div class="yolo-col">
<div class="cfg-grid yolo-basic">
<div class="row"><label for="yolo_cf" data-i18n="置信度">置信度</label><div class="field-unit"><input id="yolo_cf" type="number" min="1" max="100" step="1" aria-describedby="yolo_cf_unit"><span class="unit" id="yolo_cf_unit">%</span></div></div>
<div class="row"><label for="yolo_nm">NMS IoU</label><div class="field-unit"><input id="yolo_nm" type="number" min="1" max="100" step="1" aria-describedby="yolo_nm_unit"><span class="unit" id="yolo_nm_unit">%</span></div></div>
</div>
</div>
<div class="yolo-col">
<div class="cfg-grid yolo-upload">
<div class="row">
<label for="yolo_model_f" data-i18n="上传模型">上传模型</label>
<div class="yolo-file-choice"><input type="file" id="yolo_model_f" accept=".rknn" hidden><button type="button" class="add-btn" data-file-picker="yolo_model_f" data-i18n="选择文件">选择文件</button><span data-file-name="yolo_model_f" data-i18n="未选择文件">未选择文件</span></div>
<button type="button" class="add-btn yolo-upload-btn" onclick="uploadYolo('model')" data-i18n="上传">上传</button>
</div>
<div class="row">
<label for="yolo_names_f" data-i18n="上传标签">上传标签</label>
<div class="yolo-file-choice"><input type="file" id="yolo_names_f" accept=".names,.txt" hidden><button type="button" class="add-btn" data-file-picker="yolo_names_f" data-i18n="选择文件">选择文件</button><span data-file-name="yolo_names_f" data-i18n="未选择文件">未选择文件</span></div>
<button type="button" class="add-btn yolo-upload-btn" onclick="uploadYolo('names')" data-i18n="上传">上传</button>
</div>
</div>
</div>
</div>
</div>
</div>

<div class="bottom-grid">
<div class="card" id="card_cpufreq"><h3><span data-i18n="CPU 频率">CPU 频率</span><span class="card-status" id="status_cpufreq"></span><span class="ip-cur" id="cf_cur">当前未读取</span><button type="button" class="btn btn-save card-save" data-action="cpu-save"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v9.5"/><path d="M8.2 10.2L12 14l3.8-3.8"/><path d="M5 19h14"/></svg> <span data-i18n="保存">保存</span></button></h3>
<div class="cfg-grid vid2">
<div class="row"><label data-i18n="CPU 策略组">CPU 策略组</label><select id="cf_policy"></select></div>
<div class="row"><label data-i18n="调度策略">调度策略</label><select id="cf_gov"></select></div>
<div class="row"><label for="cf_min" data-i18n="最低频率">最低频率</label><div class="field-unit"><select id="cf_min" aria-describedby="cf_min_unit"></select><span class="unit" id="cf_min_unit">MHz</span></div></div>
<div class="row"><label for="cf_max" data-i18n="最高频率">最高频率</label><div class="field-unit"><select id="cf_max" aria-describedby="cf_max_unit"></select><span class="unit" id="cf_max_unit">MHz</span></div></div>
</div>

</div>
<section class="card" id="card_codex" aria-labelledby="codex_cfg_title">
  <h3 id="codex_cfg_title"><span data-i18n="Codex CLI 配置">Codex CLI 配置</span>
    <span class="card-status" id="status_codex" role="status" aria-live="polite"></span><span class="codex-update-text" id="codex_update_result" hidden></span>
    <span class="codex-head-actions">
      <button type="button" class="btn btn-back codex-login-btn" id="codex_login_btn" data-i18n="登录">登录</button>
      <button type="button" class="btn btn-back" id="codex_update_check" data-i18n="检查更新">检查更新</button>
    </span>
  </h3>
  <div class="codex-run">
    <div class="codex-run-field"><label for="codex_model" data-i18n="模型">模型</label>
      <select id="codex_model">
        <option value="" data-i18n="默认（跟随 CLI）">默认（跟随 CLI）</option>
        <option value="gpt-5.1-codex-max">gpt-5.1-codex-max</option>
        <option value="gpt-5.2">gpt-5.2</option>
        <option value="gpt-5.1-codex">gpt-5.1-codex</option>
        <option value="gpt-5.1">gpt-5.1</option>
        <option value="gpt-5-codex">gpt-5-codex</option>
        <option value="gpt-5">gpt-5</option>
      </select>
    </div>
    <div class="codex-run-field"><label for="codex_effort" data-i18n="推理速率">推理速率</label>
      <select id="codex_effort">
        <option value="minimal" data-i18n="极低（minimal）">极低（minimal）</option>
        <option value="low" data-i18n="低（low）">低（low）</option>
        <option value="medium" data-i18n="中（medium，推荐）">中（medium，推荐）</option>
        <option value="high" data-i18n="高（high）">高（high）</option>
        <option value="xhigh" data-i18n="极高（xhigh，仅 codex-max / 5.2）">极高（xhigh，仅 codex-max / 5.2）</option>
      </select>
    </div>
  </div>
  <div class="codex-quota" id="codex_quota" aria-live="polite" hidden>
    <div class="codex-quota-head">
      <span class="codex-quota-title" data-i18n="可用额度">可用额度</span>
      <span class="codex-plan" id="codex_plan"></span>
      <span class="codex-reset" id="codex_reset"></span>
    </div>
    <div class="codex-quota-meters">
      <span class="codex-meter">
        <span class="codex-meter-label" id="codex_label_5h">5 小时</span>
        <span class="codex-meter-bar"><i id="codex_bar_5h"></i></span>
        <span class="codex-meter-val" id="codex_pct_5h">—</span>
      </span>
      <span class="codex-meter">
        <span class="codex-meter-label" id="codex_label_wk">每周</span>
        <span class="codex-meter-bar"><i id="codex_bar_wk"></i></span>
        <span class="codex-meter-val" id="codex_pct_wk">—</span>
      </span>
    </div>
  </div>
  <div class="codex-login-area" id="codex_login_area" hidden>
    <div class="codex-device-row">
      <a id="codex_device_link" class="codex-device-link" target="_blank" rel="noopener" data-i18n="正在获取登录链接…">正在获取登录链接…</a>
    </div>
    <div class="codex-device-row">
      <span class="codex-device-code" id="codex_device_code">— — — —</span>
      <button type="button" class="btn btn-back" id="codex_device_copy" data-i18n="复制验证码">复制验证码</button>
    </div>
    <p class="codex-hint" id="codex_device_hint"></p>
  </div>
</section>
</div>

<div class="bottom-grid">
<section class="card" id="card_network" aria-labelledby="network_title">
  <h3 id="network_title"><span data-i18n="网络代理与测试">网络代理与测试</span>
    <label class="toggle" data-i18n-title="代理开关" title="代理开关"><input type="checkbox" id="proxy_enabled"><span class="slider"></span></label>
    <span class="proxy-badge" id="proxy_service_badge">—</span>
    <span class="card-status" id="status_nettest"></span>
    <span class="proxy-head-actions">
      <span class="nt-result" id="nt_ping_result"></span>
    <span class="nt-result" id="nt_speed_result"></span>
    <button type="button" class="btn btn-save card-save" id="proxy_save"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v9.5"/><path d="M8.2 10.2L12 14l3.8-3.8"/><path d="M5 19h14"/></svg> <span data-i18n="保存">保存</span></button>
    </span>
  </h3>
  <div class="net-grid" id="card_nettest">
    <div class="net-field"><label for="proxy_host" data-i18n="代理主机">代理主机</label><input type="text" id="proxy_host" placeholder="192.168.1.5" autocomplete="off"></div>
    <div class="net-field"><label for="proxy_port" data-i18n="端口">端口</label><input type="number" id="proxy_port" min="1" max="65535" step="1"></div>
    <div class="net-field"><label for="proxy_scheme" data-i18n="协议">协议</label><select id="proxy_scheme"><option value="http">http</option><option value="socks5">socks5</option><option value="socks5h">socks5h</option></select></div>
    <div class="net-field"><label for="proxy_no_proxy" data-i18n="不走代理的地址">不走代理的地址</label><input type="text" id="proxy_no_proxy" autocomplete="off"></div>
    <div class="net-field w6"><label for="nt_ping_target" data-i18n="Ping 测试">Ping 测试</label>
      <div class="nt-input-group"><input type="text" id="nt_ping_target" data-i18n-ph="IP / 域名" placeholder="IP / 域名" value="192.168.1.1"><button type="button" class="btn btn-back nt-go" data-net-test="ping" data-i18n="测试">测试</button></div>
    </div>
    <div class="net-field w6"><label for="nt_speed_target" data-i18n="网速测试">网速测试</label>
      <div class="nt-input-group"><select id="nt_speed_target"><option value="https://speed.cloudflare.com/__down?bytes=5000000" data-i18n="Cloudflare CDN">Cloudflare CDN</option><option value="https://proof.ovh.net/files/1Mb.dat" data-i18n="OVH (欧洲)">OVH (欧洲)</option><option value="custom" data-i18n="自定义地址">自定义地址</option></select><input type="text" id="nt_speed_custom" placeholder="https://..." style="display:none"><button type="button" class="btn btn-back nt-go" data-net-test="speed" data-i18n="测速">测速</button></div>
    </div>
  </div>
  <p class="card-status proxy-status" id="status_proxy" role="status" aria-live="polite"></p>
</section>
</div>

<div class="can-grid can-disabled">
  <form class="card" id="camera_form">
    <h3><span data-i18n="视频采集">视频采集</span><span id="camera_status" class="card-status" role="status" aria-live="polite"></span><button class="btn btn-save card-save" type="submit" id="camera_save"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v9.5"/><path d="M8.2 10.2L12 14l3.8-3.8"/><path d="M5 19h14"/></svg> <span data-i18n="保存">保存</span></button></h3>
    <div class="camera-fields">
      <div class="row"><label for="camera_device" data-i18n="相机设备">相机设备</label><select id="camera_device"></select></div>
      <div class="row"><label for="camera_mode" data-i18n="分辨率与帧率">分辨率与帧率</label><div class="field-unit"><select id="camera_mode" aria-describedby="camera_mode_unit"></select><span class="unit" id="camera_mode_unit">FPS</span></div></div>
    </div>
  </form>
<div class="card" id="card_can" hidden><h3><select id="canSel" onchange="onCanSel()"></select> <span id="st"></span> <label class="toggle"><input type="checkbox" id="tg" onchange="toggleCan(this.checked)"><span class="slider"></span></label><span class="card-status" id="status_can"></span><a href="/dbc" class="btn btn-back can-dbc-link"><span data-i18n="DBC解析">DBC解析</span></a><button type="button" class="btn btn-save card-save" onclick="saveCan()"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v9.5"/><path d="M8.2 10.2L12 14l3.8-3.8"/><path d="M5 19h14"/></svg> <span data-i18n="保存">保存</span></button></h3>
<div id="cfg">
<div class="cfg-grid can-basic">
<div class="row"><label for="br" data-i18n="波特率">波特率</label><div class="field-unit"><input name="br" id="br" type="number" aria-describedby="br_unit"><span class="unit" id="br_unit">bps</span></div></div>
<div class="row"><label data-i18n="DBC 文件">DBC 文件</label><input type="file" id="dbc" accept=".dbc" hidden><button type="button" class="add-btn" data-file-picker="dbc" data-i18n="选择文件">选择文件</button><span class="unit" data-file-name="dbc" data-i18n="未选择文件" style="flex:1;overflow-wrap:anywhere">未选择文件</span><button type="button" class="add-btn" onclick="uploadDbc()" data-i18n="上传">上传</button></div>
<div class="row"><label>CAN FD</label><select name="fd" id="fd" onchange="chkFd()"><option value="on">on</option><option value="off">off</option></select></div>
<div class="row" id="dbr"><label for="db" data-i18n="FD波特率">FD波特率</label><div class="field-unit"><input name="db" id="db" type="number" aria-describedby="db_unit"><span class="unit" id="db_unit">bps</span></div></div>
</div>
<div class="filters">
<h4><span data-i18n="CAN-ID 过滤器">CAN-ID 过滤器</span><button type="button" class="add-btn" onclick="addFilter()" data-i18n="+ 添加">+ 添加</button></h4>
<div id="fil"></div>
</div>
</div><div class="hint" id="hint" data-i18n="接口已关闭，开启后可配置">接口已关闭，开启后可配置</div></div>

<div class="card" id="card_net"><h3><span data-i18n="Web与匿名助手设置">Web与匿名助手设置</span><span class="card-status" id="status_net"></span><button type="button" class="btn btn-save card-save" id="network_save" disabled onclick="saveNet()"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v9.5"/><path d="M8.2 10.2L12 14l3.8-3.8"/><path d="M5 19h14"/></svg> <span data-i18n="保存">保存</span></button></h3>
<div class="cfg-grid net2">
<div class="row"><label data-i18n="Web网卡">Web网卡</label><select name="bind" id="bind"><option value="" data-i18n="选择网卡">选择网卡</option></select></div>
<div class="row"><label data-i18n="IP 模式">IP 模式</label><select id="ip_mode" onchange="chkIpMode()"><option value="" data-i18n="关闭（不管理）">关闭（不管理）</option><option value="static" data-i18n="静态">静态</option><option value="dhcp">DHCP</option></select></div>
<div class="row" id="ip_a_row"><label data-i18n="IP 地址">IP 地址</label><input id="ip_a" type="text" placeholder="192.168.1.100"></div>
<div class="row" id="ip_m_row"><label data-i18n="子网掩码">子网掩码</label><input id="ip_m" type="text" placeholder="255.255.255.0"></div>
<div class="row" id="ip_g_row"><label data-i18n="网关">网关</label><input id="ip_g" type="text" placeholder="192.168.1.1"></div>
</div>
</div>
</div>



<div class="bottom-grid" id="follow_slot"></div>



<div id="msg"></div>
</div>
