<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="DBC 信号解析">DBC 信号解析</title>
<link rel="stylesheet" href="/css/tokens.css?v=2026110707">
<link rel="stylesheet" href="/css/layout.css?v=2026110707">
<link rel="stylesheet" href="/css/components.css?v=2026110707">
<script src="/js/theme.js?v=2026110707"></script>
<script src="/js/palette.js?v=2026110707"></script>
<script src="/js/i18n.js?v=2026110707"></script>
<script src="/js/auth.js?v=2026110707"></script>
<script src="/js/app.js?v=2026110707"></script>
<style>
/* 本页只保留 DBC 解析特有的样式；顶栏/表格/卡片全部来自 layout.css + components.css */
.table-wrap{overflow-x:auto;border-radius:var(--r-md)}
/* 固定列宽：数据为空时自动布局会把宽度全给第一列，表头挤到右边去 */
.table-wrap table{table-layout:fixed}
.table-wrap th:nth-child(1){width:64px}
.table-wrap th:nth-child(2){width:110px}
.table-wrap th:nth-child(3){width:110px}
.table-wrap th:nth-child(4){width:34%}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.id{color:var(--accent);font-variant-numeric:tabular-nums}
.name{color:var(--name);font-weight:600}
.sig{white-space:normal;word-break:break-all}
/* 空态说明要换行，否则在手机上被表格的 nowrap 截断 */
.empty{white-space:normal;overflow-wrap:anywhere}
.meta{color:var(--muted-2);font-size:var(--fs-12);margin-top:var(--sp-2)}
.card-head{gap:var(--sp-2)}
.filter{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:var(--fs-12);color:var(--muted)}
/* 两张表用不同的分区色，和配置页的分区标记保持一致 */
.card:nth-of-type(2){--section-mark:#4cd6ae}
.card:nth-of-type(3){--section-mark:#a58ff2}
/* 窄屏：卡片标题与"通道"筛选拆成两行。
   原来两者挤在一行，标题换行时筛选项被压成很窄一条，看着像错位。 */
@media (max-width:720px){
  .card > .card-head{flex-wrap:wrap;row-gap:var(--sp-2)}
  .card > .card-head > h3{flex:1 1 100%;min-width:0}
  .filter{margin-left:0;width:100%}
  .filter select{flex:1 1 auto;min-width:0}
  .table-wrap th:nth-child(1){width:38px}
  .table-wrap th:nth-child(2){width:84px}
  .table-wrap th:nth-child(3){width:84px}
  .table-wrap th:nth-child(4){width:auto}
}
</style>
</head>
<body>
<div class="top-bar">
  <div class="tb-left"><h1><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h3l2-5 3 10 3-10 2 5h5"/></svg> <span data-i18n="DBC 信号解析">DBC 信号解析</span></h1></div>
  <div class="tb-right">
    <a href="/" class="btn btn-back"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/></svg> <span data-i18n="主界面">主界面</span></a>
    <a href="/status" class="btn btn-back"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h3.5l2.5-7 4 14 2.5-7H21"/></svg> <span data-i18n="系统状态">系统状态</span></a>
    <a href="/config" class="btn btn-back"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17.5 7H20M4 17h2.5M11 17h9"/><circle cx="15" cy="7" r="2.3"/><circle cx="6.5" cy="17" r="2.3"/></svg> <span data-i18n="系统配置">系统配置</span></a>
    <a href="/logs" class="btn btn-back"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.4A1.9 1.9 0 0 1 4.9 5.5h3.8l2 2.6h8.4a1.9 1.9 0 0 1 1.9 1.9v6.6a1.9 1.9 0 0 1-1.9 1.9H4.9A1.9 1.9 0 0 1 3 16.6z"/></svg> <span data-i18n="文件下载">文件下载</span></a>
    <button id="langBtn" class="theme-btn" onclick="toggleLang()" data-i18n-title="切换语言">English</button>
    <button id="themeBtn" class="theme-btn" onclick="toggleTheme()" data-i18n-title="切换主题"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 14.6A8.6 8.6 0 1 1 9.4 3.8a7 7 0 0 0 10.8 10.8z"/></svg></button>
    <button id="paletteBtn" class="theme-btn" onclick="cyclePalette()" data-i18n-title="切换配色"></button>
  </div>
</div>
<div class="card">
  <div class="card-head">
    <h3 data-i18n="最近解析的 CAN 信号">最近解析的 CAN 信号</h3>
    <label class="filter"><span data-i18n="通道">通道</span>
      <select id="channel"><option value="" data-i18n="全部">全部</option></select>
    </label>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>#</th><th data-i18n="接口">接口</th><th>ID</th><th data-i18n="报文">报文</th><th data-i18n="信号值">信号值</th></tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="5" class="empty" data-i18n="等待数据…">等待数据…</td></tr>
      </tbody>
    </table>
  </div>
  <div class="meta" id="meta"></div>
</div>
<div class="card">
  <div class="card-head">
    <h3 data-i18n="最近发送的 CAN 信号（发送方向）">最近发送的 CAN 信号（发送方向）</h3>
    <label class="filter"><span data-i18n="通道">通道</span>
      <select id="channel-tx"><option value="" data-i18n="全部">全部</option></select>
    </label>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>#</th><th data-i18n="接口">接口</th><th>ID</th><th data-i18n="报文">报文</th><th data-i18n="信号值">信号值</th></tr>
      </thead>
      <tbody id="rows-tx">
        <tr><td colspan="5" class="empty" data-i18n="等待数据…">等待数据…</td></tr>
      </tbody>
    </table>
  </div>
  <div class="meta" id="meta-tx"></div>
</div>
<script src="/js/dbc.js?v=2026110707"></script>
<script src="/js/mobile-nav.js?v=2026110707"></script>
<nav class="tabbar" aria-label="主导航"><a class="tab" href="/"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16.5h16"/><path d="M6 16.5l1.5-5A2 2 0 0 1 9.4 10h5.2a2 2 0 0 1 1.9 1.5l1.5 5"/><circle cx="7.5" cy="18.2" r="1.7"/><circle cx="16.5" cy="18.2" r="1.7"/></svg><span data-i18n="主界面">主界面</span></a><a class="tab" href="/status"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h3.5l2.5-7 4 14 2.5-7H21"/></svg><span data-i18n="系统状态">系统状态</span></a><a class="tab" href="/config"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17.5 7H20M4 17h2.5M11 17h9"/><circle cx="15" cy="7" r="2.3"/><circle cx="6.5" cy="17" r="2.3"/></svg><span data-i18n="系统配置">系统配置</span></a><a class="tab" href="/logs"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.4A1.9 1.9 0 0 1 4.9 5.5h3.8l2 2.6h8.4a1.9 1.9 0 0 1 1.9 1.9v6.6a1.9 1.9 0 0 1-1.9 1.9H4.9A1.9 1.9 0 0 1 3 16.6z"/></svg><span data-i18n="文件下载">文件下载</span></a></nav></body>
</html>
