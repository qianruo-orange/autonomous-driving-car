<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="相机配置">相机配置</title>
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/config.css">
<link rel="stylesheet" href="/css/camera.css">
<script src="/js/theme.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/auth.js"></script>
</head><body class="camera-page">
<div class="top-bar">
  <div class="tb-left"><h1>📷 <span data-i18n="相机配置">相机配置</span></h1></div>
  <div class="tb-right">
    <a href="/" class="btn btn-back"><span data-i18n="仪表盘">仪表盘</span></a>
    <a href="/config" class="btn btn-back"><span data-i18n="配置">配置</span></a>
    <a href="/dbc" class="btn btn-back"><span data-i18n="DBC解析">DBC解析</span></a>
    <a href="/logs" class="btn btn-back"><span data-i18n="文件下载">文件下载</span></a>
    <button id="langBtn" class="theme-btn" type="button" onclick="toggleLang()" data-i18n-title="切换语言">EN</button>
    <button id="themeBtn" class="theme-btn" type="button" onclick="toggleTheme()" data-i18n-title="切换主题">🌙</button>
  </div>
</div>
<main class="camera-grid">
  <form class="card" id="camera_form">
    <h3><span data-i18n="视频采集">视频采集</span></h3>
    <div class="camera-fields">
      <div class="row"><label for="camera_device" data-i18n="相机设备">相机设备</label><select id="camera_device"></select></div>
      <div class="row"><label for="camera_codec" data-i18n="视频编码">视频编码</label><select id="camera_codec"><option value="software" data-i18n="软件编码">软件编码</option><option value="hardware" data-i18n="硬件编码">硬件编码</option></select></div>
      <div class="row"><label for="camera_size" data-i18n="分辨率">分辨率</label><select id="camera_size"></select></div>
      <div class="row"><label for="camera_fps" data-i18n="帧率">帧率</label><select id="camera_fps"></select><span class="unit">FPS</span></div>
    </div>
    <p class="tip" id="camera_cap_hint" data-i18n="仅显示相机与编码器共同支持的分辨率和帧率。">仅显示相机与编码器共同支持的分辨率和帧率。</p>
    <p class="tip" id="camera_encoder_hint"></p>
    <p class="tip" data-i18n="保存采集参数后，视频和录像会重新启动。">保存采集参数后，视频和录像会重新启动。</p>
    <div class="camera-actions">
      <button class="btn btn-back" type="button" id="camera_refresh" data-i18n="查询">查询</button>
      <button class="btn btn-save" type="submit" id="camera_save" data-i18n="保存">保存</button>
    </div>
    <p id="camera_status" class="camera-status" role="status" aria-live="polite"></p>
  </form>
  <section class="card camera-focus-card"><h3 data-i18n="相机调焦">相机调焦</h3><div data-camera-focus></div></section>
</main>
<script src="/js/camera.js"></script>
<script src="/js/camera-focus.js"></script>
</body></html>
