<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="自动驾驶小车">自动驾驶小车</title>
<link rel="stylesheet" href="/css/tokens.css?v=2026110709">
<link rel="stylesheet" href="/css/layout.css?v=2026110709">
<link rel="stylesheet" href="/css/components.css?v=2026110709">
<link rel="stylesheet" href="/css/monitor.css?v=2026110709">
<link rel="stylesheet" href="/css/camera.css?v=2026110709">
<link rel="stylesheet" href="/css/codex-chat.css?v=2026110709">
<script src="/js/theme.js?v=2026110709"></script>
<script src="/js/palette.js?v=2026110709"></script>
<script src="/js/i18n.js?v=2026110709"></script>
<script src="/js/auth.js?v=2026110709"></script>
<script src="/js/app.js?v=2026110709"></script>
</head><body>
<div class="top-bar">
  <div class="tb-left"><h1><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16.5h16"/><path d="M6 16.5l1.5-5A2 2 0 0 1 9.4 10h5.2a2 2 0 0 1 1.9 1.5l1.5 5"/><circle cx="7.5" cy="18.2" r="1.7"/><circle cx="16.5" cy="18.2" r="1.7"/></svg> <span data-i18n="自动驾驶小车">自动驾驶小车</span></h1></div>
  <div class="tb-right">
    <span id="datetime"></span>
    <a href="/status" class="btn btn-back"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h3.5l2.5-7 4 14 2.5-7H21"/></svg> <span data-i18n="系统状态">系统状态</span></a>
    <a href="/config" class="btn btn-back"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17.5 7H20M4 17h2.5M11 17h9"/><circle cx="15" cy="7" r="2.3"/><circle cx="6.5" cy="17" r="2.3"/></svg> <span data-i18n="系统配置">系统配置</span></a>
    <a href="/logs" class="btn btn-back"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.4A1.9 1.9 0 0 1 4.9 5.5h3.8l2 2.6h8.4a1.9 1.9 0 0 1 1.9 1.9v6.6a1.9 1.9 0 0 1-1.9 1.9H4.9A1.9 1.9 0 0 1 3 16.6z"/></svg> <span data-i18n="文件下载">文件下载</span></a>
    <button id="langBtn" class="theme-btn" onclick="toggleLang()" data-i18n-title="切换语言">English</button>
    <button id="themeBtn" class="theme-btn" onclick="toggleTheme()" data-i18n-title="切换主题"></button>
    <button id="paletteBtn" class="theme-btn" onclick="cyclePalette()" data-i18n-title="切换配色"></button>
    <a href="#" onclick="reboot()" class="pwr pwr-reboot"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.7-6"/><path d="M20 4.5V10h-5.5"/></svg> <span data-i18n="重启">重启</span></a>
    <a href="#" onclick="shutdown()" class="pwr pwr-shutdown"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v7.5"/><path d="M7.6 6.6a7 7 0 1 0 8.8 0"/></svg> <span data-i18n="关机">关机</span></a>
  </div>
</div>

<div class="grid">
  <div class="monitor-grid">
    <div class="video-column">
      <div class="card video-card">
        <div class="video-fps" id="video_fps">-- FPS</div>
        <div class="video-wrapper">
          <video id="stream_video" autoplay muted playsinline></video>
          <img id="stream_img" style="display:none" alt="" onerror="this.style.display='none'">
          <canvas id="stream_overlay" aria-hidden="true"></canvas>
          <div id="tracking_overlay" aria-label="图像目标追踪" data-i18n-aria-label="图像目标追踪"></div>
        </div>
        <div class="tracking-toolbar">
          <span id="tracking_status" role="status">点击识别框记录外观并开始追踪</span>
          <div class="video-stats" id="video_stats" aria-live="off"></div>
        </div>
      </div>
    </div>
    <aside class="status-column codex-side" aria-label="Codex 对话">
      <section class="card codex-chat codex-chat-side" id="codex_chat" aria-labelledby="codex_chat_title">
        <div class="codex-chat-head">
          <h3 id="codex_chat_title"><span data-i18n="Codex 对话">Codex 对话</span></h3>
          <span class="codex-badge" id="codex_login_badge" data-i18n="未登录">未登录</span>
          <span class="card-status" id="status_codex_chat" role="status" aria-live="polite"></span>
          <div class="codex-chat-actions">
            <button type="button" class="btn btn-back" id="codex_stop_btn" data-i18n="停止" hidden>停止</button>
          </div>
        </div>
        <div class="codex-chat-log" id="codex_chat_log" role="log" aria-live="polite"></div>
        <form class="codex-chat-form" id="codex_chat_form">
          <textarea id="codex_chat_input" rows="2" data-i18n-ph="输入消息，Enter 发送，Shift+Enter 换行" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
          <button type="submit" class="btn btn-save" id="codex_send_btn" data-i18n="发送">发送</button>
        </form>
        <div class="codex-chat-foot"><span id="codex_chat_meta"></span></div>
      </section>
    </aside>
  </div>
</div>
<script src="/js/monitor.js?v=2026110709"></script>
<script src="/js/image-tracking.js?v=2026110709"></script>
