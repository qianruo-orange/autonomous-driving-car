<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="自动驾驶小车">自动驾驶小车</title>
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/monitor.css">
<link rel="stylesheet" href="/css/camera.css">
<link rel="stylesheet" href="/css/codex-chat.css">
<script src="/js/theme.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/app.js"></script>
</head><body>
<div class="top-bar">
  <div class="tb-left"><h1>📶 <span data-i18n="自动驾驶小车">自动驾驶小车</span></h1></div>
  <div class="tb-right">
    <span id="datetime"></span>
    <a href="/config" class="btn btn-back">⚙ <span data-i18n="系统配置">系统配置</span></a>
    <a href="/logs" class="btn btn-back"> <span data-i18n="行驶日志">行驶日志</span></a>
    <button id="langBtn" class="theme-btn" onclick="toggleLang()" data-i18n-title="切换语言">English</button>
    <button id="themeBtn" class="theme-btn" onclick="toggleTheme()" data-i18n-title="切换主题"></button>
    <a href="#" onclick="reboot()" class="pwr pwr-reboot"> <span data-i18n="重启">重启</span></a>
    <a href="#" onclick="shutdown()" class="pwr pwr-shutdown"> <span data-i18n="关机">关机</span></a>
  </div>
</div>

<div class="grid">
  <div class="monitor-grid">
    <div class="video-column">
      <div class="card video-card">
        <div class="video-fps" id="video_fps">-- FPS</div>
        <div class="video-wrapper">
          <video id="stream_video" autoplay muted playsinline></video>
          <img id="stream_img" style="display:none" alt="stream">
          <canvas id="stream_overlay" aria-hidden="true"></canvas>
          <div id="tracking_overlay" aria-label="图像目标追踪" data-i18n-aria-label="图像目标追踪"></div>
        </div>
        <div class="tracking-toolbar">
          <span id="tracking_status" role="status">点击识别框记录外观并开始追踪</span>
          <div class="video-stats" id="video_stats" aria-live="off"></div>
        </div>
      </div>
    </div>
    <div class="status-column">
      <div class="card"><h3>CPU</h3>
        <div class="val-row"><span class="val" id="cpu_val">--%</span><span class="temp" id="temp">-°C</span></div>
        <div class="bar cpu-bar"><div class="green" id="cpu_bar" style="width:0%"></div></div>
        <div class="core-bars" id="cpu_cores"></div>
      </div>
      <div class="card">
        <div class="sec duo">
          <div class="half"><h4><span data-i18n="内存">内存</span><b id="mem_val">--%</b></h4>
          <div class="bar"><div class="blue" id="mem_bar" style="width:0%"></div></div>
          <div class="used"><b id="mem_used">-</b> / <span id="mem_total">-</span></div></div>
          <div class="half"><h4><span data-i18n="磁盘">磁盘</span><b id="disk_val">--%</b></h4>
          <div class="bar"><div class="yellow" id="disk_bar" style="width:0%"></div></div>
          <div class="used"><b id="disk_used">-</b> / <span id="disk_total">-</span></div></div>
        </div>
      </div>
      <div class="card">
        <div class="sec"><h4>NPU</h4><div class="core-bars" id="npu_cores"></div></div>
        <div class="sec"><h4>RGA</h4><div class="core-bars" id="rga_cores"></div></div>
      </div>
      <div class="card"><h3 data-i18n="网络速度">网络速度</h3><div id="net_speed"></div></div>
    </div>
  </div>
</div>

<section class="card codex-chat" id="codex_chat" aria-labelledby="codex_chat_title">
  <div class="codex-chat-head">
    <h3 id="codex_chat_title"><span data-i18n="Codex 对话">Codex 对话</span></h3>
    <span class="codex-badge" id="codex_login_badge" data-i18n="未登录">未登录</span>
    <span class="card-status" id="status_codex_chat" role="status" aria-live="polite"></span>
    <div class="codex-chat-actions">
      <button type="button" class="btn btn-back" id="codex_new_btn" data-i18n="新会话">新会话</button>
      <button type="button" class="btn btn-back" id="codex_stop_btn" data-i18n="停止" hidden>停止</button>
      <a href="/config#card_codex" class="btn btn-back" data-i18n="配置">配置</a>
      <button type="button" class="btn btn-back" id="codex_download_btn" data-i18n="下载记录">下载记录</button>
    </div>
  </div>
  <div class="codex-chat-log" id="codex_chat_log" role="log" aria-live="polite"></div>
  <form class="codex-chat-form" id="codex_chat_form">
    <textarea id="codex_chat_input" rows="2" data-i18n-ph="输入消息，Enter 发送，Shift+Enter 换行" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
    <button type="submit" class="btn btn-save" id="codex_send_btn" data-i18n="发送">发送</button>
  </form>
  <div class="codex-chat-foot"><span id="codex_chat_meta"></span></div>
</section>

<script src="/js/monitor.js"></script>
<script src="/js/image-tracking.js"></script>
<script src="/js/codex-chat.js"></script>
</body></html>
