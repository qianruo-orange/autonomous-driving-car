# EXAMPLE ONLY. Copy to car_motor_can.conf only after replacing every protocol
# value with the motor manufacturer's specification. These IDs and stop bytes
# are illustrative, not a supported motor model or an enable/start sequence.
# The controller retains its strict FIFO scheduling gate and starts stopped.
# Configure the drive's independent command watchdog before any hardware test.
enabled 0
interface can0
feedback_pair_timeout_ms 100

# Commands contain signed int16 values; normalized [-1,1] maps to raw [-1000,1000].
# This example merges left/right fields into one 8-byte classic-CAN frame.
left.cmd_id 0x201
left.cmd_extended 0
left.cmd_fd 0
left.cmd_length 8
left.cmd_template 00 00 00 00 00 00 00 00
left.cmd_offset 0
left.cmd_width 16
left.cmd_big_endian 0
left.cmd_scale 1000
left.cmd_bias 0
left.stop_template 00 00 00 00 00 00 00 00
left.fb_id 0x181
left.fb_extended 0
left.fb_fd 0
left.fb_length 8
left.fb_offset 0
left.fb_width 16
left.fb_big_endian 0
# Convert actual signed raw wheel-speed feedback into m/s.
left.fb_scale 0.001

right.cmd_id 0x201
right.cmd_extended 0
right.cmd_fd 0
right.cmd_length 8
right.cmd_template 00 00 00 00 00 00 00 00
right.cmd_offset 2
right.cmd_width 16
right.cmd_big_endian 0
right.cmd_scale 1000
right.cmd_bias 0
right.stop_template 00 00 00 00 00 00 00 00
right.fb_id 0x182
right.fb_extended 0
right.fb_fd 0
right.fb_length 8
right.fb_offset 0
right.fb_width 16
right.fb_big_endian 0
right.fb_scale 0.001
